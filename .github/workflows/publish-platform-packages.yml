name: Publish verified v3.1.1 platform packages
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify unchanged full-project tools
        run: |
          python -m pip install python-docx pillow
          python -m unittest discover -s scripts/tests -q
      - uses: actions/download-artifact@v4
        with:
          name: packages-windows-x64
          path: verified/windows-x64
          run-id: 39813709610
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: packages-macos-arm64
          path: verified/macos-arm64
          run-id: 39813709610
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-x64
          path: verified/linux-x64
          run-id: 39813709610
          github-token: ${{ github.token }}
      - name: Build current source-only full packages
        env:
          PACKAGE_BUILD: ${{ github.workspace }}/source-full
        run: python scripts/release/build_packages.py --full-only
      - name: Verify source-only full and native NO-AI packages
        shell: python
        run: |
          from pathlib import Path,PurePosixPath
          import hashlib,json,struct,tarfile,zipfile,shutil,subprocess
          output=Path('release-ready');output.mkdir()
          sums=[]
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          expected={n for n in tracked if n and not n.startswith(('scripts/release/','.github/')) and Path(n).is_file() and Path(n).name!='debug.log'}
          for suffix in ['windows-x64','macos-arm64','linux-x64']:
              folder=Path('verified')/suffix
              reports=list(folder.rglob(suffix+'-query-smoke.json'))
              assert reports and json.loads(reports[0].read_text())['ok'],suffix
              for edition in ['no-ai-zone','sign-song-agent']:
                  search=folder if edition=='no-ai-zone' else Path('source-full/artifacts')
                  matches=list(search.rglob(edition+'-v3.1.1-*'+suffix+('.tar.gz' if suffix.startswith('linux') else '.zip')))
                  assert len(matches)==1,matches
                  p=matches[0]
                  digest=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert digest==p.with_name(p.name+'.sha256').read_text().split()[0]
                  z=tarfile.open(p) if suffix.startswith('linux') else zipfile.ZipFile(p,metadata_encoding='utf-8' if suffix.startswith('macos') else None)
                  if suffix.startswith('linux'):
                      paths={m.name for m in z.getmembers() if m.isfile() or m.issym()}
                      read=lambda n:z.extractfile(n).read()
                  else:
                      assert z.testzip() is None
                      paths={n for n in z.namelist() if not n.startswith('__MACOSX/') and not n.endswith('/')}
                      read=z.read
                  root='NO-AI-ZONE' if edition=='no-ai-zone' else '手语歌智能工坊'
                  assert all(n.startswith(root+'/') for n in paths)
                  tops={PurePosixPath(n).parts[1] for n in paths}
                  if edition=='no-ai-zone':
                      exe='规则与例句查询.exe' if suffix.startswith('windows') else '规则与例句查询.app/Contents/MacOS/Query' if suffix.startswith('macos') else '规则与例句查询'
                      raw=read(root+'/'+exe)
                      if suffix.startswith('windows'):
                          assert raw[:2]==b'MZ' and struct.unpack_from('<H',raw,struct.unpack_from('<I',raw,60)[0]+4)[0]==0x8664
                      elif suffix.startswith('macos'):
                          assert raw[:4]==b'\xcf\xfa\xed\xfe' and struct.unpack_from('<I',raw,4)[0]==0x100000c
                      else:
                          assert raw[:4]==b'\x7fELF' and struct.unpack_from('<H',raw,18)[0]==62
                      assert len(tops)==6,tops
                      assert not {'scripts','_internal','AGENTS.md','工作台','dictionaries'}&tops
                      for name in ['STOP-AI.jpg','STOP-USING-AI.jpg']:
                          assert read(root+'/'+name)==Path('scripts/release/assets',name).read_bytes()
                  else:
                      assert {n[len(root)+1:] for n in paths}==expected
                      assert not {'规则与例句查询.exe','规则与例句查询.app','规则与例句查询','本系统使用说明.txt','许可说明.txt','STOP-AI.jpg','STOP-USING-AI.jpg'}&tops
                      for name in expected:
                          assert read(root+'/'+name)==Path(name).read_bytes(),name
                      assert root+'/资料/规则与例句查询程序.pyw' in paths
                  assert not any('/__pycache__/' in n or '/.git/' in n or n.endswith('/debug.log') for n in paths)
                  z.close()
                  shutil.copy2(p,output/p.name)
                  sums.append(digest+'  '+p.name)
          (output/'SHA256SUMS.txt').write_text('\n'.join(sorted(sums))+'\n')
      - name: Upload verified packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          release=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/tags/v3.1.1']))
          existing={a['name']:a for a in release['assets']}
          for path in sorted(Path('release-ready').iterdir()):
              digest='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
              if existing.get(path.name,{}).get('digest')==digest:
                  print('Unchanged, preserve asset:',path.name)
                  continue
              subprocess.run(['gh','release','upload','v3.1.1',str(path),'--repo',repo,'--clobber'],check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-manifest
          path: release-ready/SHA256SUMS.txt

