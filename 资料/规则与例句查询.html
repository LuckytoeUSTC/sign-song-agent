cx>)，正文第54段。\n\n> 用寺庙表示神殿不合适（敲木鱼）\n\n出处：[太阳升起的舞蹈_老师注释版_组长修后_B版.docx](\u003c../teacher-remarked/太阳升起的舞蹈_老师注释版_组长修后_B版.docx>)，正文第54段。\n\n> 有几个动作需要两手五指并拢\n\n出处：[RE太阳升起的舞蹈_教学整理版_四修.docx](\u003c../reviewed/RE太阳升起的舞蹈_教学整理版_四修.docx>)，批注10。\n\n> 问题不大的\n\n**Codex归纳**：文化动作联想、手形转换与词序一起评估；所谓近义建筑不能直接套图。\n\n**适用边界**：组长回复只针对本句地点后置疑问，不是全面认证文化解释。\n", "rules": [{"id": "R01", "basis": "案例关联标注"}, {"id": "R10", "basis": "案例关联标注"}]}, {"id": "太阳-M015", "title": "没有文字记录过的神圣祭典", "expression": "短句表达的清楚程度及老师补充信息的选择", "context": "将长句拆为短句，或希望结合背景知识调整教学表达时", "source": "修改案例", "location": "", "link": "%E8%AE%B2%E4%B9%89%E5%88%B6%E4%BD%9C%E8%BF%87%E7%A8%8B%E5%AD%98%E6%A1%A3/%E5%A4%AA%E9%98%B3%E5%8D%87%E8%B5%B7%E7%9A%84%E8%88%9E%E8%B9%88/%E8%BD%AC%E5%86%99%E4%BF%AE%E6%94%B9%E4%B8%8E%E8%BE%A8%E6%9E%90%E6%A1%88%E4%BE%8B/%E5%A4%AA%E9%98%B3-M015%20%E6%B2%A1%E6%9C%89%E6%96%87%E5%AD%97%E8%AE%B0%E5%BD%95%E8%BF%87%E7%9A%84%E7%A5%9E%E5%9C%A3%E7%A5%AD%E5%85%B8.md", "full": "# 没有文字记录过的神圣祭典\n\n编号速查：`太阳-M001`表示《太阳升起的舞蹈》的第1个修改案例；`R01`是公共转写规则，`太阳-R01`是本曲转写规则。编号不随排序改变。\n\n**编号**：太阳-M015\n\n**手语歌**：太阳升起的舞蹈\n\n**何时参考**：将长句拆为短句，或希望结合背景知识调整教学表达时\n\n**核心辨析**：短句表达的清楚程度及老师补充信息的选择\n\n**关联规则**：R03，R13\n\n## 修改经过\n\n**原方案**：古代/祭祀/典礼/神圣/字/记录/没有\n\n**修改后方案**：过去/字/没有②/祭祀/记录①/不能②\n\n**原话归属**：旧Codex稿、人工转写与组长评价\n\n出处：[太阳升起的舞蹈_手语翻译_拓宽版.docx](\u003c../LLM-demo/太阳升起的舞蹈_手语翻译_拓宽版.docx>)，正文第217段。\n\n> 古代/祭祀/典礼/神圣/字/记录/没有\n\n出处：[太阳升起的舞蹈_老师注释版_组长修后_B版.docx](\u003c../teacher-remarked/太阳升起的舞蹈_老师注释版_组长修后_B版.docx>)，正文第55段。\n\n> 过去/字/没有②/祭祀/记录①/不能②\n\n出处：[RE太阳升起的舞蹈_教学整理版_四修.docx](\u003c../reviewed/RE太阳升起的舞蹈_教学整理版_四修.docx>)，批注11。\n\n> 一下就能看得懂歌词表意\n\n**老师本次说明（2026-10-07）**：老师希望加入“印加文明没有文字系统”的背景信息，用清晰明了的短句表达；意义是否与歌词完全一致并非唯一考虑，取舍由老师综合判断。\n\n**可复用经验**：把含有多处分句、修饰或从句的长难句拆成主谓或主谓宾明确的短句，已由老师确认加入R13。\n\n**适用范围**：本曲补充的背景及具体转写保留在本案例中；公共R13只规定一种可选的句子组织方式。\n", "rules": [{"id": "R03", "basis": "案例关联标注"}, {"id": "R13", "basis": "案例关联标注"}]}, {"id": "太阳-M016", "title": "全曲重复段", "expression": "遗漏与有意变体的区别；当前稿件的同步范围", "context": "重复段在人工修改后没有同步，或同一句故意采用不同方案时", "source": "修改案例", "location": "", "link": "%E8%AE%B2%E4%B9%89%E5%88%B6%E4%BD%9C%E8%BF%87%E7%A8%8B%E5%AD%98%E6%A1%A3/%E5%A4%AA%E9%98%B3%E5%8D%87%E8%B5%B7%E7%9A%84%E8%88%9E%E8%B9%88/%E8%BD%AC%E5%86%99%E4%BF%AE%E6%94%B9%E4%B8%8E%E8%BE%A8%E6%9E%90%E6%A1%88%E4%BE%8B/%E5%A4%AA%E9%98%B3-M016%20%E5%85%A8%E6%9B%B2%E9%87%8D%E5%A4%8D%E6%AE%B5.md", "full": "# 全曲重复段\n\n编号速查：`太阳-M001`表示《太阳升起的舞蹈》的第1个修改案例；`R01`是公共转写规则，`太阳-R01`是本曲转写规则。编号不随排序改变。\n\n**编号**：太阳-M016\n\n**手语歌**：太阳升起的舞蹈\n\n**何时参考**：重复段在人工修改后没有同步，或同一句故意采用不同方案时\n\n**核心辨析**：遗漏与有意变体的区别；当前稿件的同步范围\n\n**关联规则**：R12\n\n## 修改经过\n\n**原方案**：LLM-demo后面多处仍保留旧转写，与前面人工改稿不同\n\n**修改后方案**：当前两版32句转写一致；后段选择句是有意变体；旧分析附录删除\n\n**原话归属**：跨版本结构比较；本聊天删除附录与同步要求\n\n出处：[太阳升起的舞蹈_手语翻译_拓宽版.docx](\u003c../LLM-demo/太阳升起的舞蹈_手语翻译_拓宽版.docx>)，正文第43段。\n\n> 突出的双眼\n\n出处：[太阳升起的舞蹈_手语翻译_拓宽版.docx](\u003c../LLM-demo/太阳升起的舞蹈_手语翻译_拓宽版.docx>)，正文第83段。\n\n> 脸/眼/突出/神仙/或者/祭祀/人/虔诚/哪?\n\n出处：[太阳升起的舞蹈_老师注释版_组长修后_B版.docx](\u003c../teacher-remarked/太阳升起的舞蹈_老师注释版_组长修后_B版.docx>)，正文第61段。\n\n> 是/神/突出的双眼/还是/人/虔诚/哪\n\n**Codex归纳**：人工改稿不仅改前段；同步要包含格式、选项标号、删减及对应说明。\n\n**适用边界**：有意变体不能机械覆盖成第一遍；检查以老师指定的当前文件为准。\n", "rules": [{"id": "R12", "basis": "案例关联标注"}]}], "rules": [{"id": "R01", "title": "先建立画面与陈述对象", "body": "状态：小班参考。\n\n先确定背景、人物或事物，再表达发生的动作及关系。可把背景、被作用对象提前，让观看者先知道画面在哪里、动作作用于什么。\n\n来源：[26春第一次小班](\u003c../小班讲义/26春 第一次小班.pdf>)第3—5页；[高新区第一次小班](\u003c../小班讲义/高新区第一次手语小班.pdf>)第7、12页。具体例：E0627“猫抓老鼠”、E0628“树影下的人想睡”、E0151“九十六号公路”。\n\n边界：不是固定宾语前置公式。E0636同时给出形容词前置和后置；太阳-M001“黄沙和泥土都掩埋着传说”和太阳-M014“大祭司”提示诗性表达还要考虑词义、动作衔接和老师取舍。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R02", "title": "动作及其持续、频率、完成状态", "body": "状态：小班参考。\n\n确定主要动作，再考虑“一直、经常、完了”等状态或频率怎样附着在该动作上。优先读整句，避免把汉语副词位置直接当成手语位置。\n\n来源：春季小班第3页“动词＋副词”，第5页长句讨论。例：E0629、E0636，E0175“走／慢”、E0215“退休／完了”。\n\n边界：教材E0201“迟到五分钟”和本曲太阳-M004“安静／一直”需连同含义读；++、拖长或动作方式有时承担持续信息，不要求额外补一个“一直”。原件的删除线和动态图仍需查看。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R03", "title": "否定对象、否定类型与范围", "body": "状态：小班参考。\n\n先确定否定什么，再选“不、没有、不能、不愿意”等否定表达。小班以“否定对象＋否定词”帮助入门；长句还要明确否定是作用于一个动作、并列动作，还是整个命题。停顿可能帮助区分范围。\n\n来源：春季小班第3—5页；高新小班第12页。例：E0630、E0631、E0634、E0635；E0109“不能说”、E0117“不能活”、E0181“客气／不”、E0184“不认识（摇头）”。\n\n边界：E0635两种停顿表达不同含义；不能把所有否定词互换。教材也有“不认识”“不喜欢”等整体词。太阳-M015记录老师结合背景知识组织短句的选择；句子拆分方法见R13。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R04", "title": "疑问对象与疑问表达", "body": "状态：小班参考。\n\n先区分一般疑问、特殊疑问和反问，明确问的是谁、什么、数量还是原因。小班常把疑问对象或命题先建立，再接疑问词及疑问表情。\n\n来源：春季小班第3—4页；高新小班第12页。例：E0629、E0630；E0167“名字／什么”、E0179“吃饭／完了？”、E0192、E0195。\n\n不同用法：教材E0197为“你／为什么／知道？”，疑问词在句中；春季讲义E0630和E0637为同句两种词序。不要把疑问词一律移到句末。句尾问号也不能证明原作者使用了哪种表情。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R05", "title": "选择、比较与反问分别处理", "body": "状态：小班参考。\n\n选择疑问先建立候选，可用空间位置或手指枚举区分；比较先明确比较对象和属性。反问先判断实际表达的意思，不能只按汉语“谁”查特殊疑问打法。\n\n来源：春季小班第4—5页选择疑问与比较；高新小班第12页。例：E0638比较；太阳-M006“神还是人”选择；E0029、E0037“谁能什么都拥有”在优秀讲义中转写为“有／所有／可能／没有”。反问的归类是智能体对该表达的分析，原讲义未给出语法解释。\n\n边界：比较和选择共享空间组织，但不是同一种句式；某首歌的反问转写也不是所有“谁”句的通式。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R06", "title": "动作方向与空间指代", "body": "状态：小班参考。\n\n记录谁对谁做什么、起点和终点。设定空间位置时，说明它用于当前画面、主体关系、比较或后文回指中的哪一项，并保持相关位置一致。方向能参与表达对象关系。\n\n老师已确认补充（2026-10-07）：空间位置不必在后文再次出现，当前画面或即时比较也有用途。\n\n来源：春季小班第4、6页；高新小班第9、12页。例：E0180“帮助＜”、E0181与E0200“互相帮助”、E0210“见面＜＞”、E0218左右房间指代；太阳-M013“神兽跟随神”。\n\n边界：不是所有动词都能自由变向。太阳-M002“黄沙和泥土”没有后续回指需求，老师否定了强制左右分区；具体变向和标记的选择放在对应歌曲的本曲转写规则。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R07", "title": "名词、数量与枚举", "body": "状态：小班参考。\n\n小班给出“名词＋数字、量词可省”的入门方式。先建立被计数对象，再表示数量；必要时枚举成员或空间布局。\n\n来源：春季小班第3页。例：E0214“家／人／5”，E0226桌椅数量。\n\n边界：E0201“五分钟”是时间表达，不能据此拆成通用的名词数量模板。集合、重复动作与具体数字应按原例分别读，不根据++补造一个确定数量。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R08", "title": "非手控信息参与意义", "body": "状态：小班参考。\n\n读转写中的表情、口动、身体朝向等信息，与手部动作一起理解疑问、否定和态度。文字转写没有记录的信息，回看原页、视频或向老师确认。\n\n来源：春季小班第3—6页；高新小班第3、7、9页。例：E0184摇头，E0197皱眉，E0199笑；太阳-M006身体朝向。\n\n边界：不能把表情当作可有可无的装饰，也不能从一句普通文本推断具体眉形或口动。中文斜体不是非手控信息的统一标记。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R09", "title": "具体描写、类标记与动作过程", "body": "状态：小班参考。\n\n画面能直接描述时，考虑形状、位置、运动和动作过程怎样组合；与词典转写例句比较，再确定是否需要描写或类标记。\n\n来源：春季小班第4—6页“描述画面”“根据实际表示动作”“形状＋类标记”；高新小班第9—10页。例：E0632蝴蝶飞过废墟、E0633床上阳光；E0149原转写明确标注鸟类标记；E0225开门与人物动作；太阳-M009太阳门、太阳-M010日出。\n\n边界：类标记的具体手形和运动需看原件；抽象句采用字面翻译、提取内涵或具体化，由老师结合语境、教学目的和表达效果选择。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R10", "title": "查词后考虑造词，保留老师的表达选择", "body": "状态：既有查词要求；老师于2026-10-07补充确认。\n\n这是词汇选择的顺序：先查国家通用手语词典，没有合适表达再查相关专业、历史或地区词典。现有词典都找不到合适表达时，可以讨论自己造词；造词有多种方法，不只是一种展开描述。新造或自定义的表达由老师判断、试打，并说明动作和意义。\n\n词典已有词也不必强行采用。它的文化联想、动作或意义不适合当前歌词时，老师可以自定义表达。记录选用来源及理由，区分词典词汇与本次创造的表达。\n\n例：太阳-M005“面具”参考专业词典；太阳-M012“缘分”检索既有动作线索；太阳-M014“神殿”没有直接套用“寺庙”。具体答案留在歌曲案例中。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R11", "title": "结合语境理解转写", "body": "状态：既有项目要求。\n\n指代、简答、省略和前后方案比较需要同一对话或歌曲段落。教材会话按整段读取，保留A/B/C与轮次；独立练习句不要把相邻题当故事上下文。歌词区分具体文件与位置，不据排列先后推定修订关系。\n\n来源：本项目AGENTS“检索和学习”；教材第一章两段会话。例：E0196“知道，25个”依赖E0195的问题，E0208“前天问路”解释见面回指。\n\n边界：上下文是来源记录，分析仍需另署智能体；完整会话不能替代视频中的空间与动作。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R12", "title": "重复段转写同步与有意变体", "body": "状态：既有项目要求。\n\n老师确认修改后，检查后续重复歌词的转写、选图和标记是否同步。若不同表达是有意设计，保留差异并记录理由。\n\n来源：本项目AGENTS“Word图解与打印”；太阳-M016全曲重复段。\n\n边界：不把不同版本、不同主题或不同角色的同一句歌词强制统一。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "R13", "title": "把长难句拆成清楚的短句", "body": "状态：老师于2026-10-07提出并确认。\n\n遇到包含很多分句、修饰成分或从句的长难句，可以拆成几句主谓或主谓宾明确的短句，让观看者逐步看清谁做什么。根据表达需要安排人物、背景和动作的顺序。它是一种可选的翻译方式，不要求所有句子都拆开。\n\n老师可以综合歌词内涵、背景知识、教学目标和表达效果决定怎么拆、是否补充信息；补充内容和取舍理由在本曲案例中说明。\n\n现有例子：\n\n- E0501：原句“昨天半夜她女儿发烧了，她和丈夫送女儿去医院看急诊。”教材转写分为女儿发烧、父母送医两个部分，并用“他俩”明确后半句主体。\n- E0233：原句“今天是我妹妹的生日，我买了个大蛋糕，想给她一个惊喜。”教材转写分为生日背景、我买蛋糕、我想给惊喜。\n- E0299：原句“昨天半夜刮大风，雷电交加，你睡得好吗？”教材转写分开天气背景与对“你”的询问。\n- 太阳-M015：老师把抽象歌词改成清晰短句，并加入本曲所需的背景信息。具体取舍见案例。\n\n前三例的表述方式是对已有教材转写的分析；原句和完整转写保留在表达表中。", "link": "%E8%A7%84%E5%88%99%E4%B8%8E%E4%BE%8B%E5%8F%A5%E6%95%B0%E6%8D%AE%E5%BA%93/%E5%85%AC%E5%85%B1%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "太阳-R01", "title": "本曲“神”的参考图", "body": "状态：本歌曲选择，已有老师决定。\n\n范围：太阳升起的舞蹈。太阳-M007记录使用“上帝”图作为“神”的动作参考；不推广为宗教概念通用等价。", "link": "%E8%AE%B2%E4%B9%89%E5%88%B6%E4%BD%9C%E8%BF%87%E7%A8%8B%E5%AD%98%E6%A1%A3/%E5%A4%AA%E9%98%B3%E5%8D%87%E8%B5%B7%E7%9A%84%E8%88%9E%E8%B9%88/%E6%9C%AC%E6%9B%B2%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "太阳-R02", "title": "本曲“光①”的方向与标记", "body": "状态：本歌曲选择，已有老师决定。\n\n范围：太阳升起的舞蹈。太阳-M008记录电灯首动作朝向自己、正体及参考框；不推广为所有变向动作的标记规范。", "link": "%E8%AE%B2%E4%B9%89%E5%88%B6%E4%BD%9C%E8%BF%87%E7%A8%8B%E5%AD%98%E6%A1%A3/%E5%A4%AA%E9%98%B3%E5%8D%87%E8%B5%B7%E7%9A%84%E8%88%9E%E8%B9%88/%E6%9C%AC%E6%9B%B2%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "太阳-R03", "title": "本曲安静与沉默的分配", "body": "状态：本歌曲选择，来源为合作记录。\n\n范围：太阳升起的舞蹈。太阳-M004为后文保留“沉默”，前句选“安静”，并记录持续动作与省略；不推广成拟人表达禁用规则。", "link": "%E8%AE%B2%E4%B9%89%E5%88%B6%E4%BD%9C%E8%BF%87%E7%A8%8B%E5%AD%98%E6%A1%A3/%E5%A4%AA%E9%98%B3%E5%8D%87%E8%B5%B7%E7%9A%84%E8%88%9E%E8%B9%88/%E6%9C%AC%E6%9B%B2%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}, {"id": "太阳-R04", "title": "本曲“洲”的取舍", "body": "状态：本歌曲选择，已有老师决定。\n\n范围：太阳升起的舞蹈。太阳-M011记录以“洲”表达歌曲中的国度意象；洲和国家不是同义词。", "link": "%E8%AE%B2%E4%B9%89%E5%88%B6%E4%BD%9C%E8%BF%87%E7%A8%8B%E5%AD%98%E6%A1%A3/%E5%A4%AA%E9%98%B3%E5%8D%87%E8%B5%B7%E7%9A%84%E8%88%9E%E8%B9%88/%E6%9C%AC%E6%9B%B2%E8%BD%AC%E5%86%99%E8%A7%84%E5%88%99.md"}]}</script>
<script>
'use strict';
const data=JSON.parse(document.querySelector('#data').textContent),$=id=>document.getElementById(id);
let limit=30,filtered=[];
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function anchor(url,text){const n=el('a',text);n.href=url;return n}
for(const r of data.rules){const o=el('option',r.id+' '+r.title);o.value=r.id;$('rule').append(o)}
for(const e of data.entries)e.search=[e.id,e.title,e.expression,e.context,e.location,e.full,...e.rules.map(r=>r.id)].join(' ').toLocaleLowerCase();
function render(reset=true){if(reset)limit=30;const words=$('keyword').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean),rule=$('rule').value,source=$('source').value;
filtered=data.entries.filter(e=>(!source||e.source===source)&&(!rule||e.rules.some(r=>r.id===rule))&&words.every(w=>e.search.includes(w)));
$('count').textContent=filtered.length+' 条';$('rulebody').replaceChildren();
if(rule){const r=data.rules.find(r=>r.id===rule),box=el('article',null,'rule');box.append(el('h2',r.id+' '+r.title));const d=el('details');d.append(el('summary','查看转写规则'),el('div',r.body,'text'));box.append(d,anchor(r.link,'规则原文'));$('rulebody').append(box)}
$('results').replaceChildren();
for(const e of filtered.slice(0,limit)){const card=el('article',null,'card'),meta=el('div',null,'meta');meta.append(el('span',e.id),el('span',e.source));card.append(meta,el('h2',e.title));
for(const [label,text] of [[e.source==='修改案例'?'核心辨析':'手语转写',e.expression],[e.source==='修改案例'?'何时参考':'上下文',e.context]])if(text){const p=el('p');p.append(el('span',label,'label'),document.createTextNode(text));card.append(p)}
if(e.location)card.append(el('p',e.location));const chips=el('div',null,'chips');for(const r of e.rules){const b=el('button',r.id+(r.basis==='规则正文提及'?' · 正文提及':''));b.onclick=()=>{$('rule').value=r.id;render()};chips.append(b)}card.append(chips);
if(e.full){const d=el('details');d.append(el('summary',e.source==='修改案例'?'完整修改与辨析':'完整会话'),el('div',e.full,'text'));card.append(d)}if(e.link){const p=el('p');p.append(anchor(e.link,e.source==='修改案例'?'案例原文':'查看原件'));card.append(p)}$('results').append(card)}
if(!filtered.length)$('results').append(el('div','没有找到相关记录','empty'));$('more').hidden=filtered.length<=limit;
}
let timer;$('keyword').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>render(),120)};$('rule').onchange=$('source').onchange=()=>render();$('more').onclick=()=>{limit+=30;render(false)};render();
</script></html>
